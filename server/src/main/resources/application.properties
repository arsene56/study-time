spring.application.name=study-time-api
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
server.port=${SERVER_PORT:8080}

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/study_time?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${MYSQL_USER:study_time}
spring.datasource.password=${MYSQL_PASSWORD:study_time_dev}
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:study_time_redis_dev}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

app.storage.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.storage.access-key=${MINIO_ROOT_USER:study_time}
app.storage.secret-key=${MINIO_ROOT_PASSWORD:study_time_minio_dev_1234}
app.storage.bucket=${MINIO_BUCKET:study-time-homework}
app.storage.max-upload-bytes=${MAX_UPLOAD_BYTES:10485760}

# Local demo origins. Production must replace this list with the exact deployed HTTPS origins.
app.security.allowed-origins=${ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://10.*:*}

# OCR defaults to a safe local mode. Set OCR_PROVIDER=tencent and credentials to enable real recognition.
app.ocr.provider=${OCR_PROVIDER:mock}
app.ocr.tencent.secret-id=${TENCENT_CLOUD_SECRET_ID:}
app.ocr.tencent.secret-key=${TENCENT_CLOUD_SECRET_KEY:}
app.ocr.tencent.region=${TENCENT_CLOUD_REGION:ap-guangzhou}
